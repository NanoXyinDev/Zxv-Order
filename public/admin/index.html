<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — ZxvCode Store</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brandmark"><img src="https://files.catbox.moe/7zar0r.jpg"></span><span>ZxvCode <small>ADMIN</small></span></a><nav><a href="/">Store</a></nav></header><main class="admin-main"><section id="loginView" class="login-card"><span class="eyebrow">CONTROL CENTER</span><h1>Admin.</h1><p>Gunakan akun owner/admin dari users.json.</p><form id="adminLogin"><input id="adminUser" type="email" placeholder="Email" required><input id="adminPass" type="password" placeholder="Password" required><button>Sign in <span>→</span></button></form><div id="adminOut" class="notice"></div></section><section id="panelView" class="hidden"><div class="admin-title"><div><span class="eyebrow">LIVE CONTROL</span><h1>Dashboard</h1><p>Kelola wallet user dan inventory VPS.</p></div><button class="ghost dark" id="logoutBtn">Logout</button></div><div class="admin-grid"><section class="panel"><div class="panel-head"><div><h2>VPS Inventory</h2><p>SSH wajib tervalidasi sebelum masuk stock.</p></div></div><form id="vpsForm" class="form"><input id="ip" placeholder="IP / Host" required><input id="sshUser" placeholder="SSH username" required><input id="port" type="number" value="22" min="1" max="65535" required><input id="pw" type="password" placeholder="SSH password" required><input id="price" type="number" placeholder="Harga Rp" min="0" required><button>Check SSH & Add <span>→</span></button></form><div id="vpsOut" class="notice"></div></section><section class="panel"><div class="panel-head"><div><h2>Users</h2><p>Saldo tersimpan server-side.</p></div><button class="smallbtn" id="refreshUsers">Refresh</button></div><div id="users" class="stock"></div></section><section class="panel"><div class="panel-head"><div><h2>VPS Stock</h2><p>Data
